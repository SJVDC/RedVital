# RedVital — catálogo de temas (DD V3.0, Tabla 27). Única fuente de verdad del
# trabajo de inicialización: un tema que no está aquí no existe, porque el
# broker no crea temas automáticamente.
#
# Convención: redvital.<contexto>.<evento>.v<mayor>. Un consumidor añade su
# grupo: <tema>.<grupo>.retry-<n> (un tema por nivel de espera) y
# <tema>.<grupo>.dlt (mensajes muertos), DD 14.1.
#   - Donación (Spring) reintenta sin detener la partición: retry-0, -1 y -2,
#     con esperas de 2, 10 y 50 s, y luego .dlt.
#   - Campañas (.NET) reintenta en el propio consumidor unos segundos y luego
#     va a .dlt: el cliente .NET no tiene temas de reintento (entrada 83).
#   - Notificaciones (Spring) reintenta los rechazos por retry-0 a -5, con
#     esperas de 15 s a 5 min y ocho intentos en total (DD, Tabla 17).
#
# tema                                                    particiones  retención_ms
